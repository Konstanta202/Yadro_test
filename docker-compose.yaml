version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend-test-task
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - database
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend-test-task
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  database:
    image: postgres:15
    container_name: databese-test-task
    environment:
      POSTGRES_DB: test_task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
    ports:
      - "5440:5432"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge