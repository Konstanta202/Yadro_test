services:
  backend:
    build: ./backend
    container_name: backend-test-task
    env_file:
      - backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "
        uv run alembic upgrade head &&
        uv run pytest tests/unit/ -v --tb=short &&
        uv run pytest tests/integration/ -v &&
        uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    build: ./frontend
    container_name: frontend-test-task
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  database:
    image: postgres:15
    container_name: databese-test-task
    environment:
      POSTGRES_DB: test_task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
    ports:
      - "5440:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: